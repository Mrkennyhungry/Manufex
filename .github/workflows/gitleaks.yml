name: Secrets scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # daily

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — scan past commits too
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
